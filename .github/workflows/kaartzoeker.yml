name: Kaartzoeker BoosterScout (TCGdex + Cardmarket)

# Alle Pokémon-kaarten met Cardmarket-prijzen, één keer per dag, voor de kaartzoeker van BoosterScout.
# De eerste keer duurt lang (ruim 23.000 kaartdetails); daarna alleen nieuwe sets en de prijsgids.
# Schrijft kaartzoeker/kaarten.json en kaartzoeker/cache.json naar de branch tcg-data.
on:
  schedule:
    - cron: '7 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kaartzoeker
  cancel-in-progress: false

jobs:
  kaarten:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache van de vorige keer
        run: |
          mkdir -p data/kz
          git fetch -q origin tcg-data || true
          git show origin/tcg-data:kaartzoeker/cache.json > data/kz/cache.json 2>/dev/null || rm -f data/kz/cache.json
          git show origin/tcg-data:kaartzoeker/graded-cache.json > data/kz/graded-cache.json 2>/dev/null || rm -f data/kz/graded-cache.json
          git show origin/tcg-data:kaartzoeker/teksten.json > data/kz/teksten.json 2>/dev/null || rm -f data/kz/teksten.json
          git show origin/tcg-data:kaartzoeker/aanvul-cache.json > data/kz/aanvul-cache.json 2>/dev/null || rm -f data/kz/aanvul-cache.json
          ls -la data/kz
      - name: Kaarten ophalen
        run: node kaartzoeker.mjs
      - name: Namen en afbeeldingen aanvullen (pokemontcg.io, Cardmarket, eBay)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CM_APP_TOKEN: ${{ secrets.CM_APP_TOKEN }}
          CM_APP_SECRET: ${{ secrets.CM_APP_SECRET }}
          CM_ACCESS_TOKEN: ${{ secrets.CM_ACCESS_TOKEN }}
          CM_ACCESS_SECRET: ${{ secrets.CM_ACCESS_SECRET }}
        run: |
          cp data/kz/kaarten.json data/kz/kaarten-voor.json
          node kaart-aanvul.mjs || { echo "aanvullen mislukt, kaarten gaan zonder door"; cp data/kz/kaarten-voor.json data/kz/kaarten.json; }
      - name: Tussendoor bewaren (kaarten, namen, beelden)
        run: ./kz-push.sh kaarten
      - name: Graded prijzen meten (eBay)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node kaart-graded.mjs || echo "graded mislukt, kaarten gaan wel door"
      - name: Tussendoor bewaren (graded)
        run: ./kz-push.sh graded
      - name: SEO-teksten schrijven (Claude)
        timeout-minutes: 60
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node kaart-teksten.mjs || echo "teksten mislukt, de rest gaat door"
      - name: Naar de branch tcg-data
        if: always()
        run: ./kz-push.sh teksten
