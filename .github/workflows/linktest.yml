name: Linktest (eenmalig)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          A='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          P='/c/7966591/627505/9356?u=https%3A%2F%2Fwww.ebay.nl%2Fsch%2Fi.html%3F_nkw%3Dpokemon%2520pikachu%26_sacat%3D183454&subId1=dpv-test'
          {
          for h in app.partner.ebay.com partner.ebay.com ebay.pxf.io ebay.sjv.io ebay.prf.hn ebay.vzck.net ebay.i3f2.net ebay.7eer.net ebay.evyy.net imp.pxf.io; do
            echo "== $h"; getent hosts $h || echo "geen DNS"
            curl -s -m 25 -A "$A" -o /dev/null -w "eerste %{http_code} -> %{redirect_url}\n" "https://$h$P"
            curl -s -m 40 -A "$A" -L -o /dev/null -w "eind %{http_code} %{url_effective} (%{num_redirects} stappen)\n" "https://$h$P"
          done
          } > uit.txt 2>&1
          git config user.name linktest; git config user.email actions@users.noreply.github.com
          git checkout -q --orphan linktest && git rm -rqf . && cp uit.txt resultaat.txt && git add resultaat.txt && git commit -qm linktest && git push -qf origin linktest
