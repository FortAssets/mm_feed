name: Shop feed

# Twee keer per dag. Niet vaker: de uitvoer is ongeveer 5 MB en elke run die
# iets verandert zet een nieuwe versie in de repo. Prijzen in de feeds
# veranderen hoogstens een paar keer per dag, dus hier valt niets te winnen
# met vaker draaien.
#
# De tijden staan op :07 en :37. Op het hele uur draaien er bij GitHub zo veel
# jobs dat een cron er tientallen minuten naast kan zitten.
on:
  schedule:
    - cron: '7 4 * * *'
    - cron: '37 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Twee runs tegelijk zouden allebei naar dezelfde branch pushen en dan verliest
# de tweede het prijslogboek van de eerste.
concurrency:
  group: shop-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Genereer de shop-bestanden
        env:
          AWIN_KEY: ${{ secrets.AWIN_KEY }}
          MM_TOKEN: ${{ secrets.MM_TOKEN }}
        run: node --max-old-space-size=4096 shop.mjs

      # Zekerheid voor het prijslogboek: als de generator halverwege stukloopt
      # staan er lege of halve bestanden, en die wil je niet pushen. Dan is het
      # logboek van gisteren weg en dat komt niet meer terug.
      - name: Controleer de uitvoer
        run: |
          test -s data/shop/index.json || { echo "index.json ontbreekt of is leeg"; exit 1; }
          node -e "
            const d = JSON.parse(require('fs').readFileSync('data/shop/index.json', 'utf8'))
            const multi = (d.categorieen || []).reduce((s, c) => s + (c.multi || 0), 0)
            const winkels = Object.keys(d.winkels || {}).length
            console.log('producten: ' + d.totaal + ' | winkels: ' + winkels + ' | bij meer dan een winkel: ' + multi)
            if (!(d.totaal > 10000)) { console.error('te weinig producten, niet pushen'); process.exit(1) }
            // Zonder producten bij twee winkels valt er niets te vergelijken, en
            // dan is er een feed weggevallen. Zo liep de run van 3 oktober 10:38:
            // 47.727 producten en nul vergelijkingen, want MediaMarkt deed niet mee.
            if (!(multi > 300)) { console.error('nul of bijna nul vergelijkingen, er mist een feed'); process.exit(1) }
            if (!(winkels >= 3)) { console.error('maar ' + winkels + ' winkels, er mist een feed'); process.exit(1) }
          "
          ls -1 data/shop/hist/*.json.gz | wc -l

      # Twee commits, en dat is geen slordigheid.
      #
      # De worker haalt index.json bij raw.githubusercontent (korte cache, dus
      # altijd vers) en leest daar de commit uit, om de grote bestanden bij
      # jsDelivr op precies die versie op te vragen. Een jsDelivr-URL met een
      # commit erin mag voor altijd gecachet worden en is dus razendsnel.
      #
      # Maar GITHUB_SHA is de commit die je hebt uitgecheckt, niet de commit die
      # deze run straks maakt. Zette ik die erin, dan wees de pin naar de data
      # van de vorige run en liep de pagina permanent een run achter. Dat deed
      # hij ook: 3 oktober stond de verse index op 47.727 producten terwijl de
      # categoriebestanden nog uit de run daarvoor kwamen.
      #
      # Dus: eerst de data committen, dan die commit-sha in index.json zetten en
      # dat als tweede commit erbij. De pin wijst naar commit 1, en die bevat de
      # data waar de index bij hoort.
      - name: Commit en push
        run: |
          git config user.name "mm-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/shop
          if git diff --staged --quiet; then
            echo "niets veranderd, geen commit"
            exit 0
          fi
          git commit -q -m "Shop feed $(date -u +%FT%TZ)"
          sha=$(git rev-parse HEAD)
          echo "datacommit: $sha"
          node -e "
            const fs = require('fs')
            const p = 'data/shop/index.json'
            const d = JSON.parse(fs.readFileSync(p, 'utf8'))
            d.commit = process.argv[1]
            fs.writeFileSync(p, JSON.stringify(d))
          " "$sha"
          git add data/shop/index.json
          git commit -q -m "Shop feed: commit $sha in de index"
          git pull --rebase --autostash || true
          git push
